name: Android Release APK Builder

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'
        cache: 'gradle'

    - name: Grant Execute Permission for Gradle
      run: chmod +x gradlew

    - name: Clean Project and Fix Cloud Warnings
      run: ./gradlew clean --no-daemon

    - name: Build Premium Debug APK
      run: ./gradlew assembleDebug --stacktrace --info --no-daemon

    - name: Upload Clean APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TimeFlow-Premium-APK
        path: app/build/outputs/apk/debug/*.apk
        retention-days: 7
        
