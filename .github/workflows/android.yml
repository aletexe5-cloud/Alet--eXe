name: Android Release APK Builder

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'
        cache: 'gradle'

    - name: Find and Grant Execute Permission for Gradle
      run: |
        GRADLEW_PATH=$(find . -name "gradlew" -print -quit)
        if [ -z "$GRADLEW_PATH" ]; then
          echo "Error: gradlew file not found anywhere in the repository!"
          exit 1
        fi
        echo "Found gradlew at: $GRADLEW_PATH"
        chmod +x "$GRADLEW_PATH"
        echo "GRADLEW_DIR=$(dirname "$GRADLEW_PATH")" >> $GITHUB_ENV

    - name: Clean Project and Fix Cloud Warnings
      run: |
        cd ${{ env.GRADLEW_DIR }}
        ./gradlew clean --no-daemon

    - name: Build Premium Debug APK
      run: |
        cd ${{ env.GRADLEW_DIR }}
        ./gradlew assembleDebug --stacktrace --info --no-daemon

    - name: Upload Clean APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TimeFlow-Premium-APK
        path: "**/build/outputs/apk/debug/*.apk"
        retention-days: 7
        
