name: Android Release APK Builder

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'
        cache: 'gradle'

    - name: Force Build Android Project Without Wrapper
      run: |
        echo "Installing global gradle to bypass missing files..."
        sudo apt-get update && sudo apt-get install -y gradle
        echo "Executing clean and build via system gradle..."
        gradle clean assembleDebug --stacktrace --no-daemon

    - name: Upload Clean APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TimeFlow-Premium-APK
        path: "**/build/outputs/apk/debug/*.apk"
        retention-days: 7
        
