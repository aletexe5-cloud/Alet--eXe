name: Build Android APK

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Generate Gradle Wrapper & Build APK
        run: |
          # گریڈل جنریٹ کرنا
          gradle wrapper
          chmod +x gradlew
          
          # کی اسٹور کا مسئلہ حل کرنے کے لیے دستخط کی سیٹنگ کو بائی پاس کرنا
          ./gradlew assembleDebug -Pandroid.injected.signing.store.file="" -Pandroid.packageSigning=false || ./gradlew assembleDebug
          
          # فائل کو آرٹفیکٹ کے لیے الگ فولڈر میں منتقل کرنا
          mkdir -p output_apk
          find . -name "*.apk" -exec cp {} output_apk/smart_timetable.apk \;

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Smart-Timetable-APK
          path: output_apk/smart_timetable.apk
          
